<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMove | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="brand large">🚍 <span>SmartMove</span></div>
        <p class="muted center">Intelligent Transport Management System</p>
        <form id="loginForm" class="form-grid single">
            <label>Email<input id="email" type="email" placeholder="admin@smartmove.com" required></label>
            <label>Password<input id="password" type="password" placeholder="admin123" required></label>
            <button class="btn primary full" type="submit">Sign In</button>
        </form>
        <div class="demo-box">
            <strong>Demo Login</strong>
            <div>Email: admin@smartmove.com</div>
            <div>Password: admin123</div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
