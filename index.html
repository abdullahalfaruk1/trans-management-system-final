<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMove | Login</title>
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="brand larger"><span>SmartMove</span></div>
        <p class="muted center">Smart Transport Management System</p><br>
        <form id="LoginForm" class="form-grid single">
            <label>Email <input id="email" type="email" placeholder="Enter your email" required></label>
            <label>Password <input id="password" type="password" placeholder="Enter your password" required></label>
            <button class="btn primary full" type="submit">Login</button>
        </form>
        <div class="demo-box">
            <strong>Demo Login</strong>
            <div>Email: admin@smartmove.com</div>
            <div>Password: admin123</div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
